!
! SYNTHETIC TEST FIXTURE - NOT A REAL DEVICE CONFIGURATION
! Modeled on: Cisco Catalyst WS-C2960X-24TS-L running IOS 15.2 (syntax NOT verified on a device)
! All addresses are RFC 5737 documentation ranges, hostname/domain use example.invalid,
! every secret value is the literal placeholder <REDACTED>.
! Mixed compliance is INTENTIONAL (some controls satisfied, some violated). See the manifest file.
!
version 15.2
no service pad
service timestamps debug datetime localtime
service timestamps log datetime localtime
service password-encryption
!
hostname synthetic-sw1
!
boot-start-marker
boot-end-marker
!
logging buffered 64000 informational
logging origin-id hostname
logging userinfo
logging host 192.0.2.50
logging host 192.0.2.51
!
enable secret <REDACTED>
!
username fixture-breakglass privilege 15 common-criteria-policy PASSWORD_POLICY secret <REDACTED>
!
aaa new-model
!
aaa common-criteria policy PASSWORD_POLICY
 min-length 15
 max-length 127
 upper-case 1
 lower-case 1
 numeric-count 1
 special-case 1
 char-changes 8
!
aaa group server tacacs+ TACACS_GROUP
 server name AUTH_A
 server name AUTH_B
!
aaa group server radius ISE_RADIUS
 server name RADIUS_TEST
!
aaa authentication login default group TACACS_GROUP local
aaa authentication dot1x default group ISE_RADIUS
aaa authorization exec default group TACACS_GROUP local
aaa authorization commands 15 default group TACACS_GROUP local
aaa authorization network default group ISE_RADIUS
aaa accounting exec default start-stop group TACACS_GROUP
aaa accounting commands 15 default start-stop group TACACS_GROUP
aaa accounting dot1x default start-stop group ISE_RADIUS
aaa session-id common
!
login block-for 900 attempts 3 within 120
login on-failure log
login on-success log
!
switch 1 provision ws-c2960x-24ts-l
!
no ip bootp server
no ip domain-lookup
ip domain-name example.invalid
no ip http server
ip http secure-server
!
ip ssh version 2
ip ssh server algorithm mac hmac-sha2-512 hmac-sha2-256
ip ssh server algorithm encryption aes256-ctr aes192-ctr aes128-ctr
!
mls qos
vtp mode transparent
udld enable
!
ip dhcp snooping vlan 10,20,30
ip dhcp snooping
ip arp inspection vlan 10,20
!
spanning-tree mode rapid-pvst
spanning-tree loopguard default
spanning-tree extend system-id
errdisable recovery cause bpduguard
!
dot1x system-auth-control
!
ntp authentication-key 1 md5 <REDACTED>
ntp authenticate
ntp trusted-key 1
ntp server 192.0.2.60 key 1
ntp server 192.0.2.61 key 1
!
snmp-server view V3READ iso included
snmp-server view V3WRITE iso included
snmp-server group V3GROUP v3 priv read V3READ write V3WRITE
snmp-server host 192.0.2.70 version 3 priv V3USER
!
archive
 log config
  logging enable
  logging size 1000
  notify syslog contenttype plaintext
  hidekeys
!
tacacs server AUTH_A
 address ipv4 192.0.2.11
 key <REDACTED>
!
tacacs server AUTH_B
 address ipv4 192.0.2.12
 key <REDACTED>
!
radius server RADIUS_TEST
 address ipv4 198.51.100.21 auth-port 1812 acct-port 1813
 key <REDACTED>
!
vlan 10
 name DATA
vlan 20
 name VOICE
vlan 30
 name GUEST
vlan 99
 name MGMT
vlan 998
 name NATIVE_UNUSED
vlan 999
 name PARKING
!
ip access-list extended MGMT_SYNTHETIC
 permit tcp 192.0.2.0 0.0.0.255 any eq 22
 deny   ip any any log-input
ip access-list extended BLOCK_INBOUND
 deny   icmp any any
 permit ip any any
!
