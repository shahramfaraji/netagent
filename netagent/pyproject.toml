[project]
name = "netagent"
version = "0.1.0"
description = "MVP: network discovery, config backup, topology and compliance"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
ssh = ["netmiko>=4.3"]
dev = ["ruff", "mypy"]

[project.scripts]
netagent = "netagent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["netagent*"]
