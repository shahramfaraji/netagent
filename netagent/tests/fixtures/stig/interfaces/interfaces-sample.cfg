! Synthetic interface-role fixture; RFC 5737 addresses only
hostname synthetic-sw1
interface GigabitEthernet1/0/1
 description SYNTHETIC_HOST
 switchport mode access
 switchport access vlan 10
 spanning-tree portfast
 spanning-tree bpduguard enable
!
interface GigabitEthernet1/0/2
 description SYNTHETIC_PHONE_AND_HOST
 switchport mode access
 switchport access vlan 10
 switchport voice vlan 20
 spanning-tree bpduguard enable
!
interface GigabitEthernet1/0/24
 description SYNTHETIC_UPLINK_TRUNK
 switchport mode trunk
 switchport trunk native vlan 99
 switchport trunk allowed vlan 10,20,99
 channel-group 1 mode active
!
interface GigabitEthernet1/0/3
 description SYNTHETIC_DEFAULT_DYNAMIC
!
interface GigabitEthernet1/0/4
 description SYNTHETIC_SHUTDOWN
 shutdown
!
interface Port-channel1
 description SYNTHETIC_AGGREGATE
 switchport mode trunk
 switchport trunk allowed vlan 10,20,99
!
interface Vlan10
 description SYNTHETIC_SVI
 ip address 192.0.2.10 255.255.255.0
!
interface Loopback0
 ip address 192.0.2.11 255.255.255.255
!
interface Tunnel0
 description SYNTHETIC_AMBIGUOUS
!
